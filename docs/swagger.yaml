basePath: /api/v1
definitions:
  chunker.DocProfile:
    properties:
      all_caps_short_line_count:
        type: integer
      avg_line_len:
        type: number
      blank_paragraph_breaks:
        type: integer
      chinese_chapter_count:
        type: integer
      code_ratio:
        type: number
      detected_langs:
        description: Detected language hints (best-effort)
        items:
          type: string
        type: array
      english_chapter_count:
        type: integer
      form_feed_count:
        type: integer
      german_chapter_count:
        type: integer
      has_code:
        type: boolean
      has_tables:
        description: Content characteristics
        type: boolean
      md_heading_counts:
        additionalProperties:
          type: integer
        description: Markdown structure
        type: object
      md_heading_total:
        type: integer
      numbered_section_count:
        description: Heuristic indicators
        type: integer
      repeated_footer_count:
        type: integer
      std_line_len:
        type: number
      total_chars:
        type: integer
      total_lines:
        type: integer
      visual_sep_count:
        type: integer
    type: object
  chunker.StrategyTier:
    enum:
    - heading
    - heuristic
    - legacy
    type: string
    x-enum-varnames:
    - TierHeading
    - TierHeuristic
    - TierLegacy
  chunker.TierRejection:
    properties:
      reason:
        type: string
      tier:
        $ref: '#/definitions/chunker.StrategyTier'
    type: object
  datasource.ConnectorMetadata:
    properties:
      auth_type:
        description: '"oauth2", "api_key", "token", etc.'
        type: string
      capabilities:
        description: '"incremental", "webhook", "deletion_sync", etc.'
        items:
          type: string
        type: array
      description:
        type: string
      icon:
        type: string
      name:
        type: string
      priority:
        description: Priority order for UI display (lower = higher priority)
        type: integer
      type:
        type: string
    type: object
  dto.AuthLoginResponse:
    properties:
      message:
        type: string
      success:
        type: boolean
      token:
        type: string
      user:
        $ref: '#/definitions/roche_local_knowledge-agent-platform_internal_types.User'
    type: object
  errors.AppError:
    properties:
      code:
        $ref: '#/definitions/errors.ErrorCode'
      details: {}
      message:
        type: string
    type: object
  errors.ErrorCode:
    enum:
    - 1000
    - 1001
    - 1002
    - 1003
    - 1004
    - 1005
    - 1006
    - 1007
    - 1008
    - 1009
    - 1010
    - 2000
    - 2001
    - 2002
    - 2003
    - 2004
    - 2100
    - 2101
    - 2102
    - 2103
    - 2200
    - 2201
    type: integer
    x-enum-varnames:
    - ErrBadRequest
    - ErrUnauthorized
    - ErrForbidden
    - ErrNotFound
    - ErrMethodNotAllowed
    - ErrConflict
    - ErrTooManyRequests
    - ErrInternalServer
    - ErrServiceUnavailable
    - ErrTimeout
    - ErrValidation
    - ErrKnowledgeDomainNotFound
    - ErrKnowledgeDomainAlreadyExists
    - ErrKnowledgeDomainInactive
    - ErrKnowledgeDomainNameRequired
    - ErrKnowledgeDomainInvalidStatus
    - ErrAgentMissingThinkingModel
    - ErrAgentMissingAllowedTools
    - ErrAgentInvalidMaxIterations
    - ErrAgentInvalidTemperature
    - ErrVectorStoreBindingInvalid
    - ErrVectorStoreUnavailable
  gorm.DeletedAt:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
  handler.AddFavoriteRequest:
    properties:
      id:
        type: string
      type:
        type: string
    type: object
  handler.BatchDeleteKnowledgeRequest:
    properties:
      ids:
        items:
          type: string
        type: array
      kb_id:
        type: string
    required:
    - ids
    - kb_id
    type: object
  handler.CopyKnowledgeBaseRequest:
    properties:
      source_id:
        type: string
      target_id:
        type: string
      task_id:
        type: string
    required:
    - source_id
    type: object
  handler.CreateAgentRequest:
    properties:
      avatar:
        type: string
      config:
        $ref: '#/definitions/types.CustomAgentConfig'
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  handler.CreateModelRequest:
    properties:
      description:
        type: string
      display_name:
        type: string
      name:
        type: string
      parameters:
        $ref: '#/definitions/types.ModelParameters'
      source:
        $ref: '#/definitions/types.ModelSource'
      type:
        $ref: '#/definitions/types.ModelType'
    required:
    - name
    - parameters
    - source
    - type
    type: object
  handler.CreateStoreRequest:
    properties:
      connection_config:
        $ref: '#/definitions/types.ConnectionConfig'
      engine_type:
        $ref: '#/definitions/types.RetrieverEngineType'
      index_config:
        $ref: '#/definitions/types.IndexConfig'
      name:
        type: string
    required:
    - connection_config
    - engine_type
    - name
    type: object
  handler.DeleteTagRequest:
    properties:
      exclude_ids:
        description: Chunk seq_ids to exclude from deletion
        items:
          type: integer
        type: array
    type: object
  handler.EvaluationRequest:
    properties:
      chat_id:
        description: ID of chat model to use
        type: string
      dataset_id:
        description: ID of dataset to evaluate
        type: string
      knowledge_base_id:
        description: ID of knowledge base to use
        type: string
      rerank_id:
        description: ID of rerank model to use
        type: string
    type: object
  handler.FabriTextRequest:
    properties:
      model_id:
        type: string
      tags:
        items:
          type: string
        type: array
    required:
    - model_id
    type: object
  handler.GetStorageEngineStatusResponse:
    properties:
      allowed_providers:
        items:
          type: string
        type: array
      engines:
        items:
          $ref: '#/definitions/handler.StorageEngineStatusItem'
        type: array
      minio_env_available:
        type: boolean
    type: object
  handler.GetSystemInfoResponse:
    properties:
      build_time:
        type: string
      commit_id:
        type: string
      db_migration_error:
        description: |-
          DBMigrationError carries the human-readable error message recorded when
          the most recent startup migration attempt failed. Empty when migrations
          succeeded; non-empty values let the frontend surface a troubleshooting
          banner instead of silently hiding the DB version row (see issue #1319).
        type: string
      db_version:
        type: string
      edition:
        type: string
      go_version:
        type: string
      graph_database_engine:
        type: string
      keyword_index_engine:
        type: string
      minio_enabled:
        type: boolean
      started_at:
        description: StartedAt is the server process boot time (RFC3339, UTC).
        type: string
      uptime_seconds:
        description: UptimeSeconds is seconds elapsed since process start.
        type: integer
      vector_store_engine:
        type: string
      version:
        type: string
    type: object
  handler.InitializationRequest:
    properties:
      documentSplitting:
        properties:
          chunkOverlap:
            minimum: 0
            type: integer
          chunkSize:
            maximum: 10000
            minimum: 100
            type: integer
          separators:
            items:
              type: string
            minItems: 1
            type: array
        required:
        - chunkSize
        - separators
        type: object
      embedding:
        properties:
          apiKey:
            type: string
          baseUrl:
            type: string
          dimension:
            description: 添加embedding维度字段
            type: integer
          modelName:
            type: string
          source:
            type: string
        required:
        - modelName
        - source
        type: object
      llm:
        properties:
          apiKey:
            type: string
          baseUrl:
            type: string
          modelName:
            type: string
          source:
            type: string
        required:
        - modelName
        - source
        type: object
      multimodal:
        properties:
          cos:
            properties:
              appId:
                type: string
              bucketName:
                type: string
              pathPrefix:
                type: string
              region:
                type: string
              secretId:
                type: string
              secretKey:
                type: string
            type: object
          enabled:
            type: boolean
          minio:
            properties:
              bucketName:
                type: string
              pathPrefix:
                type: string
            type: object
          storageType:
            type: string
          vlm:
            properties:
              apiKey:
                type: string
              baseUrl:
                type: string
              interfaceType:
                description: '"openai"'
                type: string
              modelName:
                type: string
            type: object
        type: object
      nodeExtract:
        properties:
          enabled:
            type: boolean
          nodes:
            items:
              properties:
                attributes:
                  items:
                    type: string
                  type: array
                name:
                  type: string
              type: object
            type: array
          relations:
            items:
              properties:
                node1:
                  type: string
                node2:
                  type: string
                type:
                  type: string
              type: object
            type: array
          tags:
            items:
              type: string
            type: array
          text:
            type: string
        type: object
      questionGeneration:
        properties:
          enabled:
            type: boolean
          questionCount:
            type: integer
        type: object
      rerank:
        properties:
          apiKey:
            type: string
          baseUrl:
            type: string
          enabled:
            type: boolean
          modelName:
            type: string
        type: object
    required:
    - documentSplitting
    - embedding
    - llm
    type: object
  handler.KBModelConfigRequest:
    properties:
      asr_config:
        $ref: '#/definitions/types.ASRConfig'
      documentSplitting:
        description: 文档分块配置
        properties:
          childChunkSize:
            type: integer
          chunkOverlap:
            type: integer
          chunkSize:
            type: integer
          enableParentChild:
            type: boolean
          languages:
            items:
              type: string
            type: array
          parentChunkSize:
            type: integer
          parserEngineRules:
            items:
              $ref: '#/definitions/types.ParserEngineRule'
            type: array
          separators:
            items:
              type: string
            type: array
          strategy:
            description: |-
              Strategy / TokenLimit / Languages use pointer types so the
              handler can distinguish "field absent in payload" (no change)
              from "field present with empty/zero value" (clear / disable).
              Without that distinction, users could set strategy="auto" once
              but never reset it back to legacy / unset.
            type: string
          tokenLimit:
            type: integer
        type: object
      embeddingModelId:
        description: optional when RAG indexing is disabled
        type: string
      llmModelId:
        type: string
      multimodal:
        description: 多模态配置（仅模型相关；存储引擎在 storageProvider 中配置）
        properties:
          enabled:
            type: boolean
        type: object
      nodeExtract:
        description: 知识图谱配置
        properties:
          enabled:
            type: boolean
          nodes:
            items:
              $ref: '#/definitions/types.GraphNode'
            type: array
          relations:
            items:
              $ref: '#/definitions/types.GraphRelation'
            type: array
          tags:
            items:
              type: string
            type: array
          text:
            type: string
        type: object
      questionGeneration:
        description: 问题生成配置
        properties:
          enabled:
            type: boolean
          questionCount:
            type: integer
        type: object
      storageProvider:
        description: 存储引擎选择（"local" | "minio" | "cos"），影响文档上传与文档内图片存储，参数从全局设置读取
        type: string
      vlm_config:
        $ref: '#/definitions/types.VLMConfig'
    required:
    - llmModelId
    type: object
  handler.ListSystemAdminsResponse:
    properties:
      admins:
        items:
          $ref: '#/definitions/types.UserInfo'
        type: array
      total:
        type: integer
    type: object
  handler.MessageFeedbackRequest:
    properties:
      comment:
        type: string
      rating:
        $ref: '#/definitions/types.FeedbackRating'
      reason:
        type: string
    required:
    - rating
    type: object
  handler.ModelTestRequest:
    properties:
      apiKey:
        type: string
      appSecret:
        description: AppSecret 用于 LKEAP Rerank 等需要第二段密钥的场景（对应模型 Parameters.AppSecret）。
        type: string
      baseUrl:
        type: string
      customHeaders:
        additionalProperties:
          type: string
        type: object
      dimension:
        type: integer
      extraConfig:
        additionalProperties:
          type: string
        type: object
      interfaceType:
        type: string
      modelId:
        description: |-
          ModelID, when set, instructs the handler to substitute any missing
          secrets (APIKey, AppSecret via ExtraConfig) from the stored model
          record before assembling the test client. This lets the "Test
          connection" button work on existing models without making the
          frontend reload — and ship — the plaintext API key. Other fields
          (BaseURL, ModelName, etc.) on this request still override the
          stored values, so a user can validate a new endpoint against the
          existing credentials in one click.
        type: string
      modelName:
        type: string
      provider:
        type: string
      source:
        description: 为空时按需默认为 "remote"
        type: string
      supportsDimensionOverride:
        type: boolean
    required:
    - modelName
    type: object
  handler.MoveKnowledgeRequest:
    properties:
      knowledge_ids:
        items:
          type: string
        minItems: 1
        type: array
      mode:
        enum:
        - reuse_vectors
        - reparse
        type: string
      source_kb_id:
        type: string
      target_kb_id:
        type: string
    required:
    - knowledge_ids
    - mode
    - source_kb_id
    - target_kb_id
    type: object
  handler.MoveKnowledgeResponse:
    properties:
      knowledge_count:
        type: integer
      message:
        type: string
      source_kb_id:
        type: string
      target_kb_id:
        type: string
      task_id:
        type: string
    type: object
  handler.PreviewChunkResult:
    properties:
      content:
        type: string
      context_header:
        type: string
      end:
        type: integer
      seq:
        type: integer
      size_chars:
        type: integer
      size_tokens_approx:
        type: integer
      start:
        type: integer
    type: object
  handler.PreviewChunkingPayload:
    properties:
      chunk_overlap:
        type: integer
      chunk_size:
        type: integer
      languages:
        items:
          type: string
        type: array
      separators:
        items:
          type: string
        type: array
      strategy:
        type: string
      token_limit:
        type: integer
    type: object
  handler.PreviewChunkingRequest:
    properties:
      chunking_config:
        $ref: '#/definitions/handler.PreviewChunkingPayload'
      text:
        type: string
    type: object
  handler.PreviewChunkingResponse:
    properties:
      chunks:
        items:
          $ref: '#/definitions/handler.PreviewChunkResult'
        type: array
      profile:
        $ref: '#/definitions/chunker.DocProfile'
      rejected:
        items:
          $ref: '#/definitions/chunker.TierRejection'
        type: array
      selected_tier:
        $ref: '#/definitions/chunker.StrategyTier'
      stats:
        $ref: '#/definitions/handler.PreviewChunkingStats'
      tier_chain:
        items:
          $ref: '#/definitions/chunker.StrategyTier'
        type: array
    type: object
  handler.PreviewChunkingStats:
    properties:
      avg_chars:
        type: integer
      count:
        type: integer
      max_chars:
        type: integer
      min_chars:
        type: integer
      stddev_chars:
        type: integer
      truncated_to:
        description: |-
          TruncatedTo, when set, is the original chunk count before the
          response was truncated to previewMaxChunks for transport.
        type: integer
    type: object
  handler.PromoteUserToSystemAdminRequest:
    properties:
      email:
        type: string
      user_id:
        type: string
    type: object
  handler.RemoteModelCheckRequest:
    properties:
      apiKey:
        type: string
      appSecret:
        description: AppSecret 用于 LKEAP Rerank 等需要第二段密钥的场景（对应模型 Parameters.AppSecret）。
        type: string
      baseUrl:
        type: string
      customHeaders:
        additionalProperties:
          type: string
        type: object
      dimension:
        type: integer
      extraConfig:
        additionalProperties:
          type: string
        type: object
      interfaceType:
        type: string
      modelId:
        description: |-
          ModelID, when set, instructs the handler to substitute any missing
          secrets (APIKey, AppSecret via ExtraConfig) from the stored model
          record before assembling the test client. This lets the "Test
          connection" button work on existing models without making the
          frontend reload — and ship — the plaintext API key. Other fields
          (BaseURL, ModelName, etc.) on this request still override the
          stored values, so a user can validate a new endpoint against the
          existing credentials in one click.
        type: string
      modelName:
        type: string
      provider:
        type: string
      source:
        description: 为空时按需默认为 "remote"
        type: string
      supportsDimensionOverride:
        type: boolean
    required:
    - modelName
    type: object
  handler.RevokeSystemAdminRequest:
    properties:
      user_id:
        type: string
    required:
    - user_id
    type: object
  handler.StorageCheckRequest:
    properties:
      cos:
        $ref: '#/definitions/types.COSEngineConfig'
      ks3:
        $ref: '#/definitions/types.KS3EngineConfig'
      minio:
        $ref: '#/definitions/types.MinIOEngineConfig'
      obs:
        $ref: '#/definitions/types.OBSEngineConfig'
      oss:
        $ref: '#/definitions/types.OSSEngineConfig'
      provider:
        description: '"minio", "cos", "tos", "s3", "oss", "ks3", "obs"'
        type: string
      s3:
        $ref: '#/definitions/types.S3EngineConfig'
      tos:
        $ref: '#/definitions/types.TOSEngineConfig'
    type: object
  handler.StorageCheckResponse:
    properties:
      bucket_created:
        type: boolean
      message:
        type: string
      ok:
        type: boolean
    type: object
  handler.StorageEngineStatusItem:
    properties:
      allowed:
        type: boolean
      available:
        description: whether the engine can be used
        type: boolean
      description:
        description: short description for UI
        type: string
      name:
        description: '"local", "minio", "cos", "tos", "s3", "oss", "ks3"'
        type: string
    type: object
  handler.TestProviderRequest:
    properties:
      parameters:
        $ref: '#/definitions/types.WebSearchProviderParameters'
      provider:
        type: string
    required:
    - provider
    type: object
  handler.TestStoreRequest:
    properties:
      connection_config:
        $ref: '#/definitions/types.ConnectionConfig'
      engine_type:
        $ref: '#/definitions/types.RetrieverEngineType'
    required:
    - connection_config
    - engine_type
    type: object
  handler.TextRelationExtractionRequest:
    properties:
      model_id:
        type: string
      tags:
        items:
          type: string
        type: array
      text:
        type: string
    required:
    - model_id
    - tags
    - text
    type: object
  handler.UpdateAgentRequest:
    properties:
      avatar:
        type: string
      config:
        $ref: '#/definitions/types.CustomAgentConfig'
      description:
        type: string
      name:
        type: string
    type: object
  handler.UpdateChunkRequest:
    properties:
      chunk_index:
        type: integer
      content:
        type: string
      embedding:
        items:
          type: number
        type: array
      end_at:
        type: integer
      image_info:
        type: string
      is_enabled:
        type: boolean
      start_at:
        type: integer
    type: object
  handler.UpdateKnowledgeBaseRequest:
    properties:
      config:
        $ref: '#/definitions/types.KnowledgeBaseConfig'
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  handler.UpdateModelRequest:
    properties:
      description:
        type: string
      display_name:
        type: string
      name:
        type: string
      parameters:
        $ref: '#/definitions/types.ModelParameters'
      source:
        $ref: '#/definitions/types.ModelSource'
      type:
        $ref: '#/definitions/types.ModelType'
    type: object
  handler.UpdateProviderRequest:
    properties:
      description:
        type: string
      is_default:
        type: boolean
      name:
        type: string
      parameters:
        $ref: '#/definitions/types.WebSearchProviderParameters'
    type: object
  handler.UpdateStoreRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  handler.UpdateSystemSettingRequest:
    properties:
      value:
        description: |-
          Value is intentionally `any` (decoded as float64 / string / bool /
          etc. by the JSON unmarshaller). Service.encodeForType normalises
          these against the registry's declared type and rejects mismatches.
    type: object
  handler.addSimilarQuestionsRequest:
    properties:
      similar_questions:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - similar_questions
    type: object
  handler.auditLogListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/types.AuditLog'
        type: array
      next_cursor:
        type: integer
      success:
        type: boolean
    type: object
  handler.batchReparseKnowledgeRequest:
    properties:
      ids:
        items:
          type: string
        type: array
      kb_id:
        type: string
      process_config:
        $ref: '#/definitions/types.KnowledgeProcessOverrides'
    required:
    - ids
    - kb_id
    type: object
  handler.createKnowledgeDomainRequest:
    properties:
      description:
        maxLength: 512
        type: string
      name:
        maxLength: 128
        minLength: 1
        type: string
      name_en:
        maxLength: 128
        type: string
    required:
    - name
    type: object
  handler.dashboardChatStatsResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/types.DashboardChatStats'
      msg:
        type: string
    type: object
  handler.dashboardKnowledgeBaseStatsResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/types.DashboardKnowledgeBaseStats'
      msg:
        type: string
    type: object
  handler.dashboardOverviewResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/types.DashboardOverview'
      msg:
        type: string
    type: object
  handler.dataSourceCredentialsPutRequest:
    properties:
      credentials:
        additionalProperties: true
        type: object
    required:
    - credentials
    type: object
  handler.exchangeRateConfigRequest:
    properties:
      chf_amount:
        type: number
      rmb_amount:
        type: number
    required:
    - chf_amount
    - rmb_amount
    type: object
  handler.knowledgeResourceBatchGrantRequest:
    properties:
      effect:
        $ref: '#/definitions/types.GrantEffect'
      inherit_to_children:
        type: boolean
      knowledge_base_ids:
        items:
          type: string
        minItems: 1
        type: array
      permission:
        $ref: '#/definitions/types.KnowledgeBasePermissionLevel'
      subject_id:
        type: string
      subject_type:
        $ref: '#/definitions/types.GrantSubjectType'
    required:
    - effect
    - knowledge_base_ids
    - permission
    - subject_id
    - subject_type
    type: object
  handler.knowledgeResourceGrantRequest:
    properties:
      effect:
        $ref: '#/definitions/types.GrantEffect'
      inherit_to_children:
        type: boolean
      permission:
        $ref: '#/definitions/types.KnowledgeBasePermissionLevel'
      subject_id:
        type: string
      subject_type:
        $ref: '#/definitions/types.GrantSubjectType'
    required:
    - effect
    - permission
    - subject_id
    - subject_type
    type: object
  handler.modelCredentialsPutRequest:
    properties:
      api_key:
