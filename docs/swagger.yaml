          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Vector store not found
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: Update vector store
      tags:
      - VectorStore
