        description: |-
          RelayState is the signed round-trip token echoed by the IdP. It is
          returned in the body (unlike the OIDC nonce) because the IdP, not the
          browser, reflects it back to the ACS.
        type: string
      success:
        type: boolean
    type: object
  types.SAMLConfigResponse:
    properties:
      enabled:
        type: boolean
      provider_display_name:
        type: string
      success:
        type: boolean
    type: object
  types.SearchParams:
    properties:
      disable_keywords_match:
        type: boolean
      disable_vector_match:
        type: boolean
      keyword_threshold:
        type: number
      knowledge_base_ids:
        description: |-
          KnowledgeBaseIDs overrides the single KB ID passed to HybridSearch,
          allowing a single retrieval call to span multiple KBs that share the
          same embedding model. When empty, HybridSearch uses its own id parameter.
        items:
          type: string
        type: array
      knowledge_ids:
        items:
          type: string
        type: array
      match_count:
        type: integer
      only_recommended:
        type: boolean
      query_embedding:
        items:
          type: number
        type: array
      query_text:
        type: string
      skip_context_enrichment:
        description: |-
          SkipContextEnrichment skips fetching parent, nearby, and relation chunks
          in processSearchResults. Used by the chat pipeline where context assembly
          is handled separately in the merge stage.
        type: boolean
      tag_ids:
        description: Tag IDs for filtering (used for FAQ priority filtering)
        items:
          type: string
        type: array
      vector_threshold:
        type: number
    type: object
  types.SearchResult:
    properties:
      chunk_index:
        description: Chunk index
        type: integer
      chunk_metadata:
        description: ChunkMetadata stores chunk-level metadata (e.g., generated questions)
        items:
          type: integer
        type: array
      chunk_type:
        description: Chunk 类型
        type: string
      content:
        description: Content
        type: string
      end_at:
        description: End at
        type: integer
      id:
        description: ID
        type: string
      image_info:
        description: 图片信息 (JSON 格式)
        type: string
      knowledge_base_id:
        description: KnowledgeBaseID is the ID of the knowledge base this result belongs
          to
        type: string
      knowledge_channel:
        description: KnowledgeChannel indicates through which channel the knowledge
          was ingested (web, api, wechat, etc.)
        type: string
      knowledge_description:
        description: KnowledgeDescription is the description of the knowledge document
        type: string
      knowledge_filename:
        description: |-
          Knowledge file name
          Used for file type knowledge, contains the original file name
        type: string
      knowledge_id:
        description: Knowledge ID
        type: string
      knowledge_source:
        description: |-
          Knowledge source
          Used to indicate the source of the knowledge, such as "url"
        type: string
      knowledge_title:
        description: Knowledge title
        type: string
      match_type:
        allOf:
        - $ref: '#/definitions/types.MatchType'
        description: Match type
      matched_content:
        description: |-
          MatchedContent is the actual content that was matched in vector search
          For FAQ: this is the matched question text (standard or similar question)
        type: string
      metadata:
        additionalProperties:
          type: string
        description: Metadata
        type: object
      parent_chunk_id:
        description: 父 Chunk ID
        type: string
      score:
        description: Score
        type: number
      seq:
        description: Seq
        type: integer
      start_at:
        description: Start at
        type: integer
      sub_chunk_id:
        description: SubChunkIndex
        items:
          type: string
        type: array
    type: object
  types.Session:
    properties:
      created_at:
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      description:
        description: Description
        type: string
      id:
        description: ID
        type: string
      is_pinned:
        description: IsPinned indicates whether the session is pinned in the list.
        type: boolean
      last_request_state:
        allOf:
        - $ref: '#/definitions/types.SessionLastRequestState'
        description: |-
          LastRequestState records the input-bar state used by the most recent
          question so reopening a conversation can restore the same UI choices.
      pinned_at:
        description: PinnedAt records when the session was pinned; nil when not pinned.
        type: string
      title:
        description: Title
        type: string
      updated_at:
        type: string
      user_id:
        description: |-
          UserID is the owner scope for this session. Local users and external API
          principals both use this column.
        type: string
    type: object
  types.SessionLastRequestState:
    properties:
      agent_enabled:
        type: boolean
      agent_id:
        type: string
      knowledge_base_ids:
        items:
          type: string
        type: array
      knowledge_ids:
        items:
          type: string
        type: array
      mcp_service_ids:
        items:
          type: string
        type: array
      mentioned_items:
        items:
          $ref: '#/definitions/types.MentionedItem'
        type: array
      model_id:
        type: string
      skill_names:
        items:
          type: string
        type: array
      tag_ids:
        items:
          type: string
        type: array
      web_search_enabled:
        type: boolean
    type: object
  types.StorageConfig:
    properties:
      app_id:
        description: App ID (COS specific)
        type: string
      bucket_name:
        description: Bucket Name
        type: string
      endpoint:
        description: Endpoint (S3 specific) - e.g., s3.amazonaws.com, oss-cn-hangzhou.aliyuncs.com
        type: string
      force_path_style:
        description: ForcePathStyle (S3 specific) - whether to use path-style URLs
        type: boolean
      path_prefix:
        description: Path Prefix
        type: string
      provider:
        description: 'Provider: "cos", "minio", "s3"'
        type: string
      region:
        description: Region
        type: string
      secret_id:
        description: Secret ID (COS) / Access Key ID (S3, MinIO)
        type: string
      secret_key:
        description: Secret Key (COS) / Secret Access Key (S3, MinIO)
        type: string
      use_ssl:
        description: UseSSL (S3 specific) - whether to use HTTPS
        type: boolean
    type: object
  types.StorageEngineConfig:
    properties:
      cos:
        $ref: '#/definitions/types.COSEngineConfig'
      default_provider:
        description: '"local", "minio", "cos", "tos", "s3", "oss", "ks3", "obs"'
        type: string
      ks3:
        $ref: '#/definitions/types.KS3EngineConfig'
      local:
        $ref: '#/definitions/types.LocalEngineConfig'
      minio:
        $ref: '#/definitions/types.MinIOEngineConfig'
      obs:
        $ref: '#/definitions/types.OBSEngineConfig'
      oss:
        $ref: '#/definitions/types.OSSEngineConfig'
      s3:
        $ref: '#/definitions/types.S3EngineConfig'
      tos:
        $ref: '#/definitions/types.TOSEngineConfig'
    type: object
  types.StorageProviderConfig:
    properties:
      provider:
        description: '"local", "minio", "cos", "tos", "s3", "oss", "ks3", "obs"'
        type: string
    type: object
  types.SuggestedQuestionAnswerMode:
    enum:
    - generated
    - custom
    type: string
    x-enum-varnames:
    - SuggestedQuestionAnswerGenerated
    - SuggestedQuestionAnswerCustom
  types.SyncLog:
    properties:
      created_at:
        description: Creation timestamp (usually same as StartedAt)
        type: string
      data_source_id:
        description: Reference to the data source
        type: string
      error_message:
        description: Error details if status is "failed"
        type: string
      finished_at:
        description: Sync completion time
        type: string
      id:
        description: Unique identifier
        type: string
      items_created:
        description: New items created in knowledge base
        type: integer
      items_deleted:
        description: Items deleted from knowledge base
        type: integer
      items_failed:
        description: Items that failed to sync
        type: integer
      items_skipped:
        description: Items skipped (no changes detected)
        type: integer
      items_total:
        description: Total items fetched from source
        type: integer
      items_updated:
        description: Existing items updated
        type: integer
      knowledge_domain_id:
        description: KnowledgeDomain ID
        type: integer
      result:
        description: Detailed sync result (JSON-encoded)
        items:
          type: integer
        type: array
      started_at:
        description: Sync start time
        type: string
      status:
        description: 'Sync status: running, success, partial, failed, canceled'
        type: string
      updated_at:
        description: Last update timestamp
        type: string
    type: object
  types.SystemSetting:
    properties:
      category:
        description: |-
          Category groups settings in the management UI ("limits", "agent",
          "auth", ...). Free-form string so adding a new category is a
          data-only change.
        type: string
      created_at:
        type: string
      description:
        type: string
      enum:
        description: |-
          Enum is populated by the service layer (NOT persisted) from the
          in-code registry. Empty/nil means "free-form input"; non-empty
          means the UI should render a select with these options. Tagged
          `gorm:"-"` so GORM never tries to read/write the column.
        items:
          type: string
        type: array
      id:
        type: integer
      is_secret:
        description: |-
          IsSecret reserves UI affordances for P3 (mask + reveal-with-confirm).
          In P1 every row is is_secret=false; service Update accepts the
          column but does not yet enforce special handling.
        type: boolean
      key:
        type: string
      last_modified_by:
        type: string
      last_modified_by_name:
        description: |-
          LastModifiedByName is a display label resolved from LastModifiedBy
          (the user's UUID) at handler time — username when available,
          otherwise email. Empty for virtual rows that were never persisted
          (LastModifiedBy=""). Not stored: derived per request so renaming
          a user reflects on the next reload without a backfill job.
        type: string
      requires_restart:
        description: |-
          RequiresRestart reserves UI affordances for P3 (banner "this
          change won't take effect until the next restart"). In P1 the
          only seeded key is per-request, so always false.
        type: boolean
      updated_at:
        type: string
      value:
        items:
          type: integer
        type: array
      value_type:
        description: |-
          ValueType is one of "int", "string", "bool". Service layer rejects
          updates whose payload type does not match; UI uses it to pick
          InputNumber vs Input vs Switch.
        type: string
    type: object
  types.TOSEngineConfig:
    properties:
      access_key:
        type: string
      bucket_name:
        type: string
      endpoint:
        type: string
      path_prefix:
        type: string
      region:
        type: string
      secret_key:
        type: string
    type: object
  types.ToolResult:
    properties:
      data:
        additionalProperties: true
        description: Structured data for programmatic use
        type: object
      error:
        description: Error message if execution failed
        type: string
      images:
        description: Base64 data URIs from tool (e.g. MCP image content)
        items:
          type: string
        type: array
      output:
        description: Human-readable output
        type: string
      success:
        description: Whether the tool executed successfully
        type: boolean
    type: object
  types.UnbanUserRequest:
    properties:
      user_id:
        type: string
    required:
    - user_id
    type: object
  types.UpdateOperatorRoleRequest:
    properties:
      roles:
        $ref: '#/definitions/types.OperatorRolesPatch'
      user_id:
        type: string
    required:
    - roles
    - user_id
    type: object
  types.UpdateUserRolesRequest:
    properties:
      roles:
        $ref: '#/definitions/types.KnowledgeOfficerRolesPatch'
      user_id:
        type: string
    required:
    - roles
    - user_id
    type: object
  types.UserBanActionResponse:
    properties:
      code:
        type: integer
      message:
        type: string
      status:
        type: string
    type: object
  types.UserDetailResponse:
    properties:
      account:
        type: string
      avatar:
        type: string
      chinese_name:
        type: string
      created_at:
        type: string
      department_code:
        type: string
      department_name:
        type: string
      email:
        type: string
      employee_id:
        type: string
      english_name:
        type: string
      id:
        type: string
      is_knowledge_domain_admin:
        type: boolean
      is_system_admin:
        type: boolean
      knowledge_scopes:
        items:
          $ref: '#/definitions/types.UserKnowledgeScope'
        type: array
      provider:
        type: string
      refresh_tokens:
        items:
          $ref: '#/definitions/types.UserRefreshToken'
        type: array
      role_knowledge_officer:
        type: integer
      status:
        type: integer
      updated_at:
        type: string
      username:
        type: string
    type: object
  types.UserInfo:
    properties:
      account:
        type: string
      avatar:
        type: string
      banned_at:
        type: string
      banned_by:
        type: string
      chinese_name:
        type: string
      created_at:
        type: string
      department_code:
        type: string
      department_name:
        type: string
      email:
        type: string
      employee_id:
        type: string
      english_name:
        type: string
      id:
        type: string
      is_knowledge_domain_admin:
        type: boolean
      is_system_admin:
        type: boolean
      preferences:
        $ref: '#/definitions/types.UserPreferences'
      provider:
        type: string
      role_knowledge_officer:
        type: integer
      status:
        type: integer
      updated_at:
        type: string
      username:
        type: string
    type: object
  types.UserKnowledgeScope:
    properties:
      knowledge_base_names:
        items:
          type: string
        type: array
      knowledge_domain_id:
        type: integer
      knowledge_domain_name:
        type: string
    type: object
  types.UserPreferences:
    properties:
      enable_memory:
        description: |-
          EnableMemory mirrors the "开启记忆功能" switch in General Settings.
          nil  = preference never set (treat as feature default = false)
          *false / *true = user explicitly set the toggle.
        type: boolean
    type: object
  types.UserRefreshToken:
    properties:
      expires_at:
        type: string
      issued_at:
        type: string
      jti:
        type: string
      last_used_at:
        type: string
      status:
        type: string
    type: object
  types.VLMConfig:
    properties:
      api_key:
        description: API Key
        type: string
      base_url:
        description: Base URL
        type: string
      enabled:
        type: boolean
      interface_type:
        description: 'Interface Type: "openai"'
        type: string
      model_id:
        type: string
      model_name:
        description: |-
          兼容老版本
          Model Name
        type: string
    type: object
  types.WebSearchConfig:
    properties:
      api_key:
        description: 'Deprecated: Use WebSearchProviderEntity.Parameters.APIKey instead.'
        type: string
      blacklist:
        description: 黑名单规则列表
        items:
          type: string
        type: array
      compression_method:
        description: 压缩方法：none, summary, extract, rag
        type: string
      document_fragments:
        description: 文档片段数量（用于RAG压缩）
        type: integer
      embedding_dimension:
        description: 嵌入维度（用于RAG压缩）
        type: integer
      embedding_model_id:
        description: RAG压缩相关配置
        type: string
      include_date:
        description: 是否包含日期
        type: boolean
      max_results:
        description: 最大搜索结果数
        type: integer
      provider:
        description: 'Deprecated: Use WebSearchProviderEntity.Parameters.APIKey instead.'
        type: string
      proxy_url:
        description: Optional per-request proxy override; normally empty — use WebSearchProviderEntity.Parameters.proxy_url.
          Merged at call time when set.
        type: string
      rerank_model_id:
        description: 重排模型ID（用于RAG压缩）
        type: string
    type: object
  types.WebSearchProviderEntity:
    properties:
      created_at:
        description: Timestamps
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      description:
        description: Description
        type: string
      id:
        description: Unique identifier (UUID, auto-generated)
        type: string
      is_default:
        description: Whether this is the default provider for the knowledgeDomain
        type: boolean
      knowledge_domain_id:
        description: KnowledgeDomain ID for scoping
        type: integer
      name:
        description: User-friendly name, e.g., "Production Bing Search"
        type: string
      parameters:
        allOf:
        - $ref: '#/definitions/types.WebSearchProviderParameters'
        description: Provider-specific parameters (API key, engine ID, etc.) stored
          as encrypted JSON
      provider:
        allOf:
        - $ref: '#/definitions/types.WebSearchProviderType'
        description: 'Provider type: bing, google, duckduckgo, tavily'
      updated_at:
        type: string
    type: object
  types.WebSearchProviderParameters:
    properties:
      api_key:
        description: API key for the search provider (encrypted in DB)
        type: string
      base_url:
        description: |-
          Base URL for self-hosted search engines (e.g. SearXNG instance URL).
          Validated with utils.ValidateURLForSSRF; private hosts must be added to SSRF_WHITELIST.
        type: string
      engine_id:
        description: Google Custom Search Engine ID (only for Google provider)
        type: string
      extra_config:
        additionalProperties:
          type: string
        description: Provider-specific extra configuration for future extensibility
        type: object
      proxy_url:
        description: |-
          Optional HTTP/HTTPS proxy URL for outbound search requests (e.g. http://host:port); validated with utils.ValidateURLForSSRF.
          Does not replace the search API endpoint; only tunnels traffic to the official APIs.
        type: string
    type: object
  types.WebSearchProviderType:
    enum:
    - bing
    - google
    - duckduckgo
    - tavily
    - baidu
    - searxng
    - keenable
    type: string
    x-enum-varnames:
    - WebSearchProviderTypeBing
    - WebSearchProviderTypeGoogle
    - WebSearchProviderTypeDuckDuckGo
    - WebSearchProviderTypeTavily
    - WebSearchProviderTypeBaidu
    - WebSearchProviderTypeSearxng
    - WebSearchProviderTypeKeenable
info:
  contact: {}
  description: 企业知识采集、检索、智能体、组织授权与集成 API。
  title: RD China Enterprise AI Knowledge Hub API
  version: "2.0"
paths:
  /agent-chat/{session_id}:
    post:
      consumes:
      - application/json
      description: 基于Agent的智能问答，支持多轮对话和SSE流式响应
      parameters:
      - description: 会话ID
        in: path
        name: session_id
        required: true
        type: string
      - description: 问答请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/session.CreateKnowledgeQARequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: 问答结果（SSE流）
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      summary: Agent问答
      tags:
      - 问答
  /agent/mcp-oauth-resolutions/{pending_id}:
    post:
      consumes:
      - application/json
      description: 用户在对话中完成 OAuth 授权后调用，校验令牌存在后恢复被暂停的 Agent 工具调用
      parameters:
      - description: 待授权 ID
        in: path
        name: pending_id
        required: true
        type: string
      - description: '{service_id: string}'
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.AppError'
        "409":
          description: 用户尚未完成授权
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      summary: 完成对话内 MCP OAuth 授权
      tags:
      - MCP服务
  /agent/mcp-oauth-resolutions/{pending_id}/cancel:
    post:
      description: 用户主动跳过 OAuth 授权，解除 Agent 阻塞
      parameters:
      - description: 待授权 ID
        in: path
        name: pending_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      summary: 跳过对话内 MCP OAuth 授权
      tags:
      - MCP服务
  /agent/tool-approvals/{pending_id}:
    post:
      consumes:
      - application/json
      description: 用户审批通过或驳回一次工具调用（用于 Agent 阻塞等待审批的场景）
      parameters:
      - description: 待审批记录 ID
        in: path
        name: pending_id
        required: true
        type: string
      - description: '{decision: \'
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 审批结果
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/errors.AppError'
        "404":
          description: 待审批记录不存在
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      summary: 处理 MCP 工具调用待审批请求
      tags:
      - MCP服务
  /agents:
    get:
      consumes:
      - application/json
      description: 获取平台智能体列表（包括内置智能体）
      produces:
      - application/json
      responses:
        "200":
          description: 智能体列表
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      summary: 获取智能体列表
      tags:
      - 智能体
    post:
      consumes:
      - application/json
      description: 创建新的自定义智能体
      parameters:
      - description: 智能体信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateAgentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 创建的智能体
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      summary: 创建智能体
      tags:
      - 智能体
  /agents/{id}:
    delete:
      consumes:
      - application/json
      description: 删除指定的智能体
      parameters:
      - description: 智能体ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/errors.AppError'
        "403":
          description: 无法删除内置智能体
          schema:
            $ref: '#/definitions/errors.AppError'
        "404":
          description: 智能体不存在
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      summary: 删除智能体
      tags:
      - 智能体
    get:
      consumes:
      - application/json
