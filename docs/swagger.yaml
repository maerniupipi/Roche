        Grant/revoke the operator role for one user. The role is
        stored as is_system_admin: role_operator=1 maps to true,
        0 maps to false. This endpoint never modifies the knowledge
        officer role or its knowledge-base bindings — use
        /system/admin/users/roles/single for that. SystemAdmin only.
      parameters:
      - description: Update operator role request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/types.UpdateOperatorRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: affected count
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
      summary: Update a single user's operator role
      tags:
      - System Admin
  /system/admin/users/roles/single:
    put:
      consumes:
      - application/json
      description: |-
        Set role_knowledge_officer for one user, optionally binding
        the given knowledge bases within a knowledge domain.
        This endpoint never modifies the operator role — use
        /system/admin/users/roles/operator/single for that. SystemAdmin only.
      parameters:
      - description: Update user roles request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/types.UpdateUserRolesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: affected count
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
      summary: Update a single user's knowledge officer role
      tags:
      - System Admin
  /system/admin/users/unban:
    post:
      consumes:
      - application/json
      description: Unban a user by enabling the account. SystemAdmin only.
