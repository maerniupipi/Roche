  /system/admin/knowledge-domains/apply-default-storage-quota:
    post:
      description: |-
        Reads the current value of `knowledge_domain.default_storage_quota_gb`
        (3-tier resolver: DB > ENV > default) and writes that many
        GiB into storage_quota for every row in knowledgeDomains. Bypasses
        the per-knowledgeDomain PUT whitelist, which forbids storage_quota
        edits by Owners. SystemAdmin only.
        Idempotent — running twice with the same setting is a no-op.
      produces:
      - application/json
      responses:
        "200":
          description: '{ affected: int64, quota_bytes: int64 }'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: DB write failed
          schema:
            additionalProperties: true
            type: object
      summary: Apply the default storage quota to every existing knowledgeDomain
      tags:
      - System Admin
  /system/admin/list:
    get:
      description: |-
        Retrieve a paginated list of users with system administrator
        privileges (SystemAdmin only). Supports `offset` (default 0)
        and `limit` (default 50, max 200) query parameters. Walks the
        partial-friendly idx_users_is_system_admin index.
      parameters:
      - default: 0
        description: Page offset
        in: query
        name: offset
        type: integer
      - default: 50
        description: Page size (max 200)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: System admins retrieved successfully
          schema:
            $ref: '#/definitions/handler.ListSystemAdminsResponse'
        "403":
          description: 'Forbidden: not a system admin'
          schema:
            additionalProperties: true
            type: object
      summary: List all system administrators
      tags:
      - System Admin
  /system/admin/promote:
    post:
      consumes:
      - application/json
      description: |-
        Grant system administrator privileges to a user (SystemAdmin only).
        Idempotent: re-promoting an existing system admin returns 200 with no DB write.
        Identify the user by email (preferred for human operators) or user_id (UUID, for API clients).
      parameters:
      - description: User promotion request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.PromoteUserToSystemAdminRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User promoted successfully
          schema:
            $ref: '#/definitions/types.UserInfo'
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Forbidden: not a system admin'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties: true
            type: object
      summary: Promote a user to system administrator
      tags:
      - System Admin
  /system/admin/revoke:
    post:
      consumes:
      - application/json
      description: |-
        Remove system administrator privileges from a user (SystemAdmin only).
        Two safety guards: the caller cannot revoke their own privileges,
        and revoking the last remaining system admin is rejected — both
        prevent a SystemAdmin from accidentally locking the platform out
        of system-level administration. Idempotent on already-non-admin users.
      parameters:
      - description: User revocation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RevokeSystemAdminRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Privileges revoked successfully
          schema:
            $ref: '#/definitions/types.UserInfo'
        "400":
          description: Bad request / would remove last admin / self-revoke
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Forbidden: not a system admin'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties: true
            type: object
      summary: Revoke system administrator privileges from a user
      tags:
      - System Admin
  /system/admin/settings:
    get:
      description: |-
        Return every row in the system_settings table (system-scope,
        not knowledgeDomain-scope). SystemAdmin only.
      produces:
      - application/json
      responses:
        "200":
          description: list of settings
          schema:
            items:
              $ref: '#/definitions/types.SystemSetting'
            type: array
        "403":
          description: 'Forbidden: not a system admin'
          schema:
            additionalProperties: true
            type: object
      summary: List all system settings
      tags:
      - System Admin
  /system/admin/settings/{key}:
    delete:
      description: |-
        Removes the DB override for :key so the 3-tier resolver
        falls back to the environment variable (when configured)
        or the in-code default. Idempotent — resetting a key
        that was never persisted returns 200.
      parameters:
      - description: Setting key
        in: path
        name: key
        required: true
        type: string
      responses:
        "200":
          description: Reset acknowledged
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Unknown key
          schema:
            additionalProperties: true
            type: object
        "500":
          description: DB write failed
          schema:
            additionalProperties: true
            type: object
      summary: Reset a system setting to ENV / built-in default
      tags:
      - System Admin
    get:
      description: |-
        Returns the row matching :key. 404 when the key is unknown
        to the registry; 200 with the row when known.
      parameters:
      - description: Setting key (e.g. file.max_size_mb)
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: the setting row
          schema:
            $ref: '#/definitions/types.SystemSetting'
        "400":
          description: Unknown key
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Key registered but DB row absent
          schema:
            additionalProperties: true
            type: object
      summary: Get a single system setting by key
      tags:
      - System Admin
    put:
      consumes:
      - application/json
      description: |-
        Persist a new value for :key. Service validates the
        rawValue against the registry's declared value_type and
        rejects mismatches with 400. SystemAdmin only. Emits an
        audit row (action=system.setting_changed) on success.
      parameters:
      - description: Setting key
        in: path
        name: key
        required: true
        type: string
      - description: New value
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateSystemSettingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: the updated row
          schema:
            $ref: '#/definitions/types.SystemSetting'
        "400":
          description: Bad request / unknown key / type mismatch
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Forbidden: not a system admin'
          schema:
            additionalProperties: true
            type: object
      summary: Update a system setting value
      tags:
      - System Admin
  /system/admin/users:
    get:
      description: List users with filters matching the user-management page, paginated.
        SystemAdmin only.
      parameters:
      - default: 0
        description: Page offset
        in: query
        name: offset
        type: integer
      - default: 50
        description: Page size (max 200)
        in: query
        name: limit
        type: integer
      - description: Free-text search across username/email/account/names/employee_id
        in: query
        name: query
        type: string
      - description: Filter by account (case-insensitive like)
        in: query
        name: account
        type: string
      - description: Filter by english_name or chinese_name
        in: query
        name: employee_name
        type: string
      - description: Filter by role_knowledge_officer (0/1)
        in: query
        name: is_knowledge_officer
        type: integer
      - description: Filter by operator status (1=operator, stored as is_system_admin)
        in: query
        name: is_operator
        type: integer
      - description: Filter by department_code or department_name
        in: query
        name: department
        type: string
      - description: Filter by status (0=active, 1=banned, 2=resigned)
        in: query
        name: status
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Paginated user list
          schema:
            $ref: '#/definitions/types.ListUsersResponse'
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      summary: List all users
      tags:
      - System Admin
    post:
      consumes:
      - application/json
      description: |-
        Create a local user from the admin panel. The admin provides a
        single identifier in `id_or_email`; the server decides whether it
        is an email address (stored in `email`) or an employee id
        (stored in `employee_id`). An input containing '@' or '.com' is
        treated as an email address; any other input — including
        alphanumeric ids such as E10002 — is stored as an employee id.
        The other identifier remains empty until the user signs in via
        SSO and back-fills it. Created accounts are tagged
        provider="white_list". username and the initial password are
        derived/generated server-side. SystemAdmin only.
      parameters:
      - description: Create user request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/types.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created
          schema:
            $ref: '#/definitions/types.CreateUserResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/types.CreateUserResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/types.CreateUserResponse'
      summary: Create a user
      tags:
      - System Admin
  /system/admin/users/:id:
    get:
      description: 'Return full user information shown on the admin user detail page:
