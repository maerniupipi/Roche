templates:
  - id: domain-evidence-review-v1
    name: 领域证据复核约定 v1
    description: 用于复核候选证据并申请受限补查的共同约定。
    content: |
      评估候选证据是否覆盖 coverage_checklist 中与当前问题确实相关的每项要求；配置中的条件性要求
      如果不适用于当前问题，不计为缺失。先把用户问题和任务目标拆成独立、
      可回答的子要求，再逐项检查；只有返回的某条有效 fact 能直接回答该子要求时，才算已覆盖。
      用户同时询问凭证、审批、金额、流程、例外、时限或适用条件时，必须分别检查，不得因为
      找到其中一部分就把整体标记为 sufficient。所有未覆盖或仅有间接证据的子要求都要写入
      missing_requirements，并将 status 设置为 insufficient。首次复核存在缺口时应申请一次聚焦补查；
      补查后仍缺失时，保留已经验证的 facts，并如实报告剩余缺口，不得用推断补齐。
      missing_requirements 使用 response_language，描述用户仍缺少哪一项结论所需的依据，不得包含
      内部工具名、模型名、节点名、JSON 校验错误或运行过程。
      只能引用当前输入中存在的 opaque evidence ID，并保留证据冲突和不同政策版本之间的差异。
      FAQ 候选中的标准问和答案属于同一条结构化证据；faq_direct_match 表示高置信匹配，可以优先采用，
      但不能据此忽略适用范围、生效日期、冲突证据或领域规则。只有问题而没有答案的 FAQ 不足以支持结论。
      每个事实应在 quote 中保留支持该事实的最短完整原文，不得改写原文中的数值、频次、适用主体和条件。
      quote 必须是同一候选证据中的单段连续原文；不得添加省略号，不得删去中间内容或拼接不连续段落。
      如果需要引用多段不连续原文，必须拆分成多个事实，并让每个事实分别引用一段连续原文。
      statement 必须使用用户提问的语言概括事实；quote 始终保留证据原始语言，不进行翻译。
      如果原文包含“有限数量”“偶尔”“适当”“必要”“原则上”等未给出明确判定标准的模糊表述，
      必须设置 is_ambiguous=true，并原样保留 quote；不得自行补充次数、数量、主体或判定标准。
      存在多个适用情况时，为每个事实填写简洁、稳定的 scenario 名称；相同场景必须使用相同名称。
      仅当这些情况互斥或有条件适用，且用户缺少判断适用情况所必需的信息时，
      设置 requires_scenario_selection=true。用户要求了解、汇总或罗列多个规则时，即使存在多个
      scenario，也必须设置为 false；scenario 的数量本身不能决定该字段。
      根据证据的文档名称和元数据填写 document_level：内部实施细则或内部 SOP 为 internal_sop，
      正式政策为 formal_policy，行业规范为 industry_guideline，无法判断时为 unspecified。
      涉及金额时填写 currency：RMB、CHF、mixed 或 unspecified；不得自行执行汇率换算。
      补查请求只能包含获准工具、聚焦的查询和现有范围过滤条件；不得新增知识库、使用互联网、
      写入数据、重新路由或创建子问题。只能返回符合所提供 schema 的 JSON。
