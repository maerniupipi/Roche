# Local container-based API Gateway (nginx).
# Usage:
#   docker compose --env-file .env.local -f docker-compose.local.yml -f docker-compose.local-app.yml -f docker-compose.local-gateway.yml up -d --build
services:
  api-gateway:
    image: roche/knowledge-agent-platform-api-gateway:local
    pull_policy: build
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway.local
      args:
        - NGINX_BASE_IMAGE=${NGINX_BASE_IMAGE:-nginx:1.28.0-alpine3.21}
    container_name: roche-kap-api-gateway-local
    environment:
      - GATEWAY_FRONTEND_UPSTREAM=app:8080
      - GATEWAY_APP_UPSTREAM=app:8080
      - GATEWAY_MAX_BODY_SIZE=100m
    ports:
      - "${GATEWAY_PORT:-8089}:8080"
    networks:
      - roche-kap-network-dev
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
